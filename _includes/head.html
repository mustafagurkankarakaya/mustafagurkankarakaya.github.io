<script>
  /* Boot ekranı: yalnızca ana sayfada, oturumda bir kez. 5 sn sonra her koşulda kapanır. */
  (function () {
    try {
      var d = document.documentElement;
      if (d.getAttribute("data-layout") === "home" && !location.hash && !location.search &&
          !sessionStorage.getItem("mgk-boot") && !matchMedia("(prefers-reduced-motion: reduce)").matches) {
        d.classList.add("booting");
        setTimeout(function () { d.classList.remove("booting"); }, 5000);
      }
    } catch (e) {}
  })();
</script>

name: Build and Deploy
on:
  push:
    branches: [main, master]
    paths-ignore: [.gitignore, README.md, LICENSE]
  workflow_dispatch:
  schedule:
    # Siber güvenlik haberlerini tazelemek için 6 saatte bir yeniden derle
    - cron: "0 */6 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/configure-pages@v5
        id: pages
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Haber bağımlılıkları
        run: pip install --quiet feedparser
      - name: Son siber güvenlik haberlerini çek
        continue-on-error: true
        run: python tools/fetch_news.py || true
      - name: CISA KEV kataloğunu çek
        continue-on-error: true
        run: python tools/fetch_kev.py || true
      - run: bundle exec jekyll b -d _site --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
      - uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
